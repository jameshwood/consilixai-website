# consilix.ai on the Consilix VPS. nginx on the host proxies consilix.ai -> 127.0.0.1:3031.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: consilix_production
      POSTGRES_USER: consilix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U consilix -d consilix_production"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://consilix:${POSTGRES_PASSWORD}@db:5432/consilix_production
      RAILS_ENV: production
      PORT: "3000"
    ports:
      - "127.0.0.1:3031:3000"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "./bin/rails db:prepare && ./bin/rails server -b 0.0.0.0 -p 3000"

volumes:
  pgdata:
